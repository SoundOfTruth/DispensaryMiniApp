volumes:
  pg_data:
  media:
  static:

services:
  db:
    container_name: KOD-db
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    container_name: KOD-backend
    image: kod-backend
    build:
      context: ../backend/
    env_file: .env
    command:
      - sh
      - -c
      - |
        uv run alembic upgrade head
        uv run src/main.py
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: KOD-frontend
    build:
      context: ../frontend/
    volumes:
      - static:/app/static
      - ./frontend/:/app/result_build/
    restart: unless-stopped

  nginx:
    container_name: KOD-proxy
    build:
      context: ../nginx/
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - media:/usr/share/nginx/media/
      - static:/usr/share/nginx/static/
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - certbot
    restart: unless-stopped

  certbot:
    container_name: KOD-certbot
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  redis:
    container_name: KOD-redis
    build:
      context: ../redis/
    env_file: .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery_worker:
    image: kod-backend
    build:
      context: ../backend/
    restart: unless-stopped
    env_file:
      - .env
    command: uv run celery -A src.tasks worker --loglevel=INFO
    depends_on:
      - backend
  celery_beat:
    image: kod-backend
    build:
      context: ../backend/
    restart: unless-stopped
    env_file:
      - .env
    command: uv run celery -A src.tasks beat --loglevel=INFO
    depends_on:
      - backend