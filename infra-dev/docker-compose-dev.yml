volumes:
  pg_data:
  media:
  static:

services:
  db:
    container_name: KOD-dev-db
    image: postgres:17
    env_file: .env.dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    container_name: KOD-dev-backend
    image: kod-dev-backend
    build:
      context: ../backend/
    env_file: .env.dev
    command:
      - sh
      - -c
      - |
        uv run alembic upgrade head
        uv run src/main.py
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: KOD-dev-frontend
    build:
      context: ../frontend/
      args:
        - VITE_API_URL=/api/
        - VITE_MEDIA_URL=http://localhost:5173
    volumes:
      - static:/app/static
      - ./frontend/:/app/result_build/

  nginx:
    container_name: KOD-dev-proxy
    build:
      context: ../nginx/
      dockerfile: Dockerfile.dev
    env_file: .env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - media:/usr/share/nginx/media/
      - static:/usr/share/nginx/static/
    depends_on:
      - backend

  redis:
    container_name: KOD-dev-redis
    build:
      context: ../redis/
    env_file: .env.dev

  celery_worker:
    image: kod-dev-backend
    build:
      context: ../backend/
    restart: unless-stopped
    env_file:
      - .env.dev
    command: uv run celery -A src.tasks worker --loglevel=INFO
    depends_on:
      - backend
      
  celery_beat:
    image: kod-dev-backend
    build:
      context: ../backend/
    restart: unless-stopped
    env_file:
      - .env.dev
    command: uv run celery -A src.tasks beat --loglevel=INFO
    depends_on:
      - backend